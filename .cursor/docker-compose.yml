version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: feexsystems-postgres
    environment:
      POSTGRES_DB: feexsystems
      POSTGRES_USER: feexsystems
      POSTGRES_PASSWORD: feexsystems123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - feexsystems-network

  # Redis for caching and rate limiting
  redis:
    image: redis:7-alpine
    container_name: feexsystems-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - feexsystems-network

  # Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: feexsystems-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - server
      - client
    networks:
      - feexsystems-network

  # Backend server
  server:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    container_name: feexsystems-server
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://feexsystems:feexsystems123@postgres:5432/feexsystems
      REDIS_URL: redis://redis:6379
      JWT_SECRET: your-super-secret-jwt-key-change-in-production
      PORT: 5000
    ports:
      - "5000:5000"
    volumes:
      - ./server:/app
      - /app/node_modules
    depends_on:
      - postgres
      - redis
    networks:
      - feexsystems-network
    command: npm run dev

  # Frontend client
  client:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    container_name: feexsystems-client
    environment:
      NODE_ENV: development
      VITE_API_URL: http://localhost:5000
    ports:
      - "3000:3000"
    volumes:
      - ./client:/app
      - /app/node_modules
    networks:
      - feexsystems-network
    command: npm run dev

volumes:
  postgres_data:
  redis_data:

networks:
  feexsystems-network:
    driver: bridge 