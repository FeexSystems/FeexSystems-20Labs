<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="iosGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#059669;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="iosGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F172A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E293B;stop-opacity:1" />
    </linearGradient>
    <filter id="iosGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- iOS app icon background with rounded corners -->
  <rect x="4" y="4" width="172" height="172" rx="40" fill="url(#iosGrad2)" stroke="url(#iosGrad1)" stroke-width="4"/>
  
  <!-- Subtle tech pattern background -->
  <g opacity="0.1">
    <circle cx="30" cy="30" r="3" fill="#10B981"/>
    <circle cx="150" cy="30" r="3" fill="#3B82F6"/>
    <circle cx="30" cy="150" r="3" fill="#3B82F6"/>
    <circle cx="150" cy="150" r="3" fill="#10B981"/>
    <line x1="33" y1="30" x2="147" y2="30" stroke="#10B981" stroke-width="1"/>
    <line x1="30" y1="33" x2="30" y2="147" stroke="#10B981" stroke-width="1"/>
    <line x1="150" y1="33" x2="150" y2="147" stroke="#3B82F6" stroke-width="1"/>
    <line x1="33" y1="150" x2="147" y2="150" stroke="#3B82F6" stroke-width="1"/>
  </g>
  
  <!-- Main logo icon centered -->
  <g transform="translate(90, 90)">
    <!-- Hexagon base -->
    <polygon points="25,0 35,13.66 35,40.98 25,54.64 15,40.98 15,13.66" 
             fill="url(#iosGrad1)" stroke="white" stroke-width="3"/>
    
    <!-- Letter F inside hexagon -->
    <path d="M20 12h12v4h-9v5h8v4h-8v8h-3V12z" fill="white"/>
    
    <!-- Tech dots -->
    <circle cx="13" cy="13" r="2" fill="#10B981"/>
    <circle cx="27" cy="13" r="2" fill="#3B82F6"/>
    <circle cx="13" cy="41" r="2" fill="#3B82F6"/>
    <circle cx="27" cy="41" r="2" fill="#10B981"/>
  </g>
  
  <!-- Company name below icon -->
  <text x="90" y="140" text-anchor="middle" font-family="'Google Sans', Arial, sans-serif" font-size="16" font-weight="600" fill="white">
    FeexSystems
  </text>
  
  <!-- Glow effect -->
  <g filter="url(#iosGlow)" opacity="0.6">
    <polygon points="65,90 75,103.66 75,130.98 65,144.64 55,130.98 55,103.66" 
             fill="none" stroke="#10B981" stroke-width="2"/>
  </g>
</svg> 