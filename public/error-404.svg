<svg width="600" height="400" viewBox="0 0 600 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="errorBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F172A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E293B;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="errorAccentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EF4444;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#DC2626;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B91C1C;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="errorCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E293B;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#334155;stop-opacity:0.9" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="600" height="400" fill="url(#errorBgGrad)"/>
  
  <!-- Grid pattern -->
  <g opacity="0.05">
    <defs>
      <pattern id="errorGrid" width="40" height="40" patternUnits="userSpaceOnUse">
        <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#EF4444" stroke-width="1"/>
      </pattern>
    </defs>
    <rect width="600" height="400" fill="url(#errorGrid)"/>
  </g>
  
  <!-- Main content area -->
  <rect x="50" y="50" width="500" height="300" rx="20" fill="url(#errorCardGrad)" stroke="url(#errorAccentGrad)" stroke-width="3"/>
  
  <!-- 404 Text -->
  <text x="300" y="140" text-anchor="middle" font-family="'Google Sans', Arial, sans-serif" font-size="72" font-weight="700" fill="url(#errorAccentGrad)">
    404
  </text>
  
  <!-- Error message -->
  <text x="300" y="200" text-anchor="middle" font-family="'Google Sans', Arial, sans-serif" font-size="24" font-weight="600" fill="white">
    Page Not Found
  </text>
  
  <!-- Subtitle -->
  <text x="300" y="230" text-anchor="middle" font-family="'Google Sans', Arial, sans-serif" font-size="16" font-weight="400" fill="#94A3B8">
    The page you're looking for doesn't exist
  </text>
  
  <!-- Helpful text -->
  <text x="300" y="260" text-anchor="middle" font-family="'Google Sans', Arial, sans-serif" font-size="14" font-weight="400" fill="#64748B">
    Try navigating back or check the URL
  </text>
  
  <!-- Home button suggestion -->
  <rect x="250" y="290" width="100" height="40" rx="20" fill="url(#errorAccentGrad)" opacity="0.8"/>
  <text x="300" y="315" text-anchor="middle" font-family="'Google Sans', Arial, sans-serif" font-size="14" font-weight="600" fill="white">
    Go Home
  </text>
  
  <!-- Floating error elements -->
  <g opacity="0.6">
    <circle cx="100" cy="100" r="15" fill="url(#errorAccentGrad)"/>
    <circle cx="500" cy="120" r="12" fill="url(#errorAccentGrad)"/>
    <circle cx="120" cy="320" r="18" fill="url(#errorAccentGrad)"/>
    <circle cx="480" cy="340" r="10" fill="url(#errorAccentGrad)"/>
  </g>
  
  <!-- Circuit connections -->
  <g opacity="0.3" stroke="url(#errorAccentGrad)" stroke-width="2" fill="none">
    <path d="M 115 100 Q 200 110 480 120"/>
    <path d="M 138 320 Q 200 330 470 340"/>
    <path d="M 115 100 Q 138 210 138 320"/>
    <path d="M 480 120 Q 470 230 470 340"/>
  </g>
  
  <!-- Error icon -->
  <g transform="translate(300, 80)">
    <circle cx="0" cy="0" r="25" fill="url(#errorAccentGrad)" opacity="0.2"/>
    <circle cx="0" cy="0" r="20" fill="url(#errorAccentGrad)" opacity="0.4"/>
    <circle cx="0" cy="0" r="15" fill="url(#errorAccentGrad)"/>
    <text x="0" y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="white">!</text>
  </g>
</svg> 