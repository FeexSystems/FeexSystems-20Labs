<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="spinnerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#059669;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
    <filter id="spinnerGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="50" cy="50" r="45" fill="none" stroke="#1E293B" stroke-width="8"/>
  
  <!-- Animated spinner segments -->
  <g filter="url(#spinnerGlow)">
    <!-- Segment 1 -->
    <path d="M 50 5 A 45 45 0 0 1 85 50" stroke="url(#spinnerGrad)" stroke-width="8" stroke-linecap="round">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite" begin="0s"/>
    </path>
    
    <!-- Segment 2 -->
    <path d="M 85 50 A 45 45 0 0 1 50 95" stroke="url(#spinnerGrad)" stroke-width="8" stroke-linecap="round">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite" begin="0.375s"/>
    </path>
    
    <!-- Segment 3 -->
    <path d="M 50 95 A 45 45 0 0 1 15 50" stroke="url(#spinnerGrad)" stroke-width="8" stroke-linecap="round">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite" begin="0.75s"/>
    </path>
    
    <!-- Segment 4 -->
    <path d="M 15 50 A 45 45 0 0 1 50 5" stroke="url(#spinnerGrad)" stroke-width="8" stroke-linecap="round">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite" begin="1.125s"/>
    </path>
  </g>
  
  <!-- Center logo -->
  <g transform="translate(50, 50)">
    <!-- Small hexagon -->
    <polygon points="12,0 18,6.93 18,20.79 12,27.72 6,20.79 6,6.93" 
             fill="url(#spinnerGrad)" stroke="white" stroke-width="1"/>
    
    <!-- Letter F -->
    <path d="M9 4h6v1.5h-4.5v2h3.5v1.5h-3.5v2.5h-1.5V4z" fill="white"/>
  </g>
  
  <!-- Rotating outer ring -->
  <circle cx="50" cy="50" r="55" fill="none" stroke="url(#spinnerGrad)" stroke-width="2" opacity="0.3">
    <animateTransform attributeName="transform" type="rotate" values="0 50 50;360 50 50" dur="3s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Pulsing dots -->
  <g>
    <circle cx="50" cy="15" r="3" fill="url(#spinnerGrad)">
      <animate attributeName="r" values="3;5;3" dur="1.5s" repeatCount="indefinite" begin="0s"/>
      <animate attributeName="opacity" values="1;0.6;1" dur="1.5s" repeatCount="indefinite" begin="0s"/>
    </circle>
    
    <circle cx="85" cy="50" r="3" fill="url(#spinnerGrad)">
      <animate attributeName="r" values="3;5;3" dur="1.5s" repeatCount="indefinite" begin="0.375s"/>
      <animate attributeName="opacity" values="1;0.6;1" dur="1.5s" repeatCount="indefinite" begin="0.375s"/>
    </circle>
    
    <circle cx="50" cy="85" r="3" fill="url(#spinnerGrad)">
      <animate attributeName="r" values="3;5;3" dur="1.5s" repeatCount="indefinite" begin="0.75s"/>
      <animate attributeName="opacity" values="1;0.6;1" dur="1.5s" repeatCount="indefinite" begin="0.75s"/>
    </circle>
    
    <circle cx="15" cy="50" r="3" fill="url(#spinnerGrad)">
      <animate attributeName="r" values="3;5;3" dur="1.5s" repeatCount="indefinite" begin="1.125s"/>
      <animate attributeName="opacity" values="1;0.6;1" dur="1.5s" repeatCount="indefinite" begin="1.125s"/>
    </circle>
  </g>
</svg> 