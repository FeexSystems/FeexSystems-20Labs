<svg width="200" height="80" viewBox="0 0 200 80" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#059669;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="logoGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1F2937;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#374151;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background rectangle with subtle gradient -->
  <rect x="2" y="2" width="196" height="76" rx="12" fill="url(#logoGrad2)" stroke="url(#logoGrad1)" stroke-width="2"/>
  
  <!-- Tech circuit pattern background -->
  <g opacity="0.1">
    <circle cx="20" cy="20" r="2" fill="#10B981"/>
    <circle cx="180" cy="20" r="2" fill="#3B82F6"/>
    <circle cx="20" cy="60" r="2" fill="#3B82F6"/>
    <circle cx="180" cy="60" r="2" fill="#10B981"/>
    <line x1="22" y1="20" x2="178" y2="20" stroke="#10B981" stroke-width="1"/>
    <line x1="20" y1="22" x2="20" y2="58" stroke="#10B981" stroke-width="1"/>
    <line x1="180" y1="22" x2="180" y2="58" stroke="#3B82F6" stroke-width="1"/>
    <line x1="22" y1="60" x2="178" y2="60" stroke="#3B82F6" stroke-width="1"/>
  </g>
  
  <!-- Main logo icon -->
  <g transform="translate(25, 20)">
    <!-- Hexagon base -->
    <polygon points="15,0 25,8.66 25,26.16 15,34.82 5,26.16 5,8.66" 
             fill="url(#logoGrad1)" stroke="white" stroke-width="1.5"/>
    
    <!-- Letter F inside hexagon -->
    <path d="M10 8h10v2.5h-7.5v4h6.5v2.5h-6.5v6h-2.5V8z" fill="white"/>
    
    <!-- Tech dots -->
    <circle cx="8" cy="8" r="1" fill="#10B981"/>
    <circle cx="22" cy="8" r="1" fill="#3B82F6"/>
    <circle cx="8" cy="26" r="1" fill="#3B82F6"/>
    <circle cx="22" cy="26" r="1" fill="#10B981"/>
  </g>
  
  <!-- Company name -->
  <text x="70" y="35" font-family="'Google Sans', Arial, sans-serif" font-size="24" font-weight="600" fill="white">
    Feex
    <tspan x="70" y="55" font-size="18" font-weight="400" fill="#E5E7EB">Systems</tspan>
  </text>
  
  <!-- Tagline -->
  <text x="70" y="70" font-family="'Google Sans', Arial, sans-serif" font-size="12" font-weight="400" fill="#9CA3AF">
    Enhanced AI-Powered Platform
  </text>
  
  <!-- Glow effect on main elements -->
  <g filter="url(#glow)" opacity="0.7">
    <polygon points="40,20 50,28.66 50,46.16 40,54.82 30,46.16 30,28.66" 
             fill="none" stroke="#10B981" stroke-width="1"/>
  </g>
</svg> 