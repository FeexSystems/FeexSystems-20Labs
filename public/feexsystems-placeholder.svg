<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F172A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E293B;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E293B;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#334155;stop-opacity:0.8" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="url(#bgGrad)"/>
  
  <!-- Grid pattern -->
  <g opacity="0.1">
    <defs>
      <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
        <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#10B981" stroke-width="1"/>
      </pattern>
    </defs>
    <rect width="400" height="300" fill="url(#grid)"/>
  </g>
  
  <!-- Floating tech elements -->
  <g opacity="0.6">
    <circle cx="80" cy="80" r="15" fill="url(#accentGrad)" filter="url(#glow)"/>
    <circle cx="320" cy="120" r="12" fill="url(#accentGrad)" filter="url(#glow)"/>
    <circle cx="120" cy="220" r="18" fill="url(#accentGrad)" filter="url(#glow)"/>
    <circle cx="280" cy="240" r="10" fill="url(#accentGrad)" filter="url(#glow)"/>
  </g>
  
  <!-- Main content area -->
  <rect x="50" y="50" width="300" height="200" rx="16" fill="url(#cardGrad)" stroke="url(#accentGrad)" stroke-width="2"/>
  
  <!-- Logo placeholder -->
  <g transform="translate(180, 100)">
    <polygon points="20,0 30,11.55 30,34.64 20,46.19 10,34.64 10,11.55" 
             fill="url(#accentGrad)" stroke="white" stroke-width="2"/>
    <path d="M15 8h10v3h-7v4h6v3h-6v6h-3V8z" fill="white"/>
  </g>
  
  <!-- Company name -->
  <text x="200" y="180" text-anchor="middle" font-family="'Google Sans', Arial, sans-serif" font-size="24" font-weight="600" fill="white">
    FeexSystems
  </text>
  
  <!-- Tagline -->
  <text x="200" y="200" text-anchor="middle" font-family="'Google Sans', Arial, sans-serif" font-size="14" font-weight="400" fill="#94A3B8">
    Enhanced AI-Powered Platform
  </text>
  
  <!-- Loading animation dots -->
  <g transform="translate(200, 240)">
    <circle cx="-20" cy="0" r="4" fill="#10B981">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite" begin="0s"/>
    </circle>
    <circle cx="0" cy="0" r="4" fill="#3B82F6">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite" begin="0.5s"/>
    </circle>
    <circle cx="20" cy="0" r="4" fill="#10B981">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite" begin="1s"/>
    </circle>
  </g>
  
  <!-- Circuit connections -->
  <g opacity="0.4" stroke="url(#accentGrad)" stroke-width="1" fill="none">
    <path d="M 80 80 Q 200 100 320 120"/>
    <path d="M 120 220 Q 200 200 280 240"/>
    <path d="M 80 80 Q 120 150 120 220"/>
    <path d="M 320 120 Q 280 180 280 240"/>
  </g>
</svg> 