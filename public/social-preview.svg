<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="socialBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F172A;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1E293B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#334155;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="socialAccentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#059669;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="socialCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E293B;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#334155;stop-opacity:0.9" />
    </linearGradient>
    <filter id="socialGlow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#socialBgGrad)"/>
  
  <!-- Grid pattern -->
  <g opacity="0.05">
    <defs>
      <pattern id="socialGrid" width="80" height="80" patternUnits="userSpaceOnUse">
        <path d="M 80 0 L 0 0 0 80" fill="none" stroke="#10B981" stroke-width="2"/>
      </pattern>
    </defs>
    <rect width="1200" height="630" fill="url(#socialGrid)"/>
  </g>
  
  <!-- Floating tech elements -->
  <g opacity="0.4">
    <circle cx="200" cy="150" r="40" fill="url(#socialAccentGrad)" filter="url(#socialGlow)"/>
    <circle cx="1000" cy="200" r="35" fill="url(#socialAccentGrad)" filter="url(#socialGlow)"/>
    <circle cx="250" cy="450" r="45" fill="url(#socialAccentGrad)" filter="url(#socialGlow)"/>
    <circle cx="950" cy="480" r="30" fill="url(#socialAccentGrad)" filter="url(#socialGlow)"/>
  </g>
  
  <!-- Main content area -->
  <rect x="100" y="100" width="1000" height="430" rx="24" fill="url(#socialCardGrad)" stroke="url(#socialAccentGrad)" stroke-width="4"/>
  
  <!-- Logo and branding -->
  <g transform="translate(400, 200)">
    <!-- Large hexagon logo -->
    <polygon points="60,0 80,34.64 80,103.92 60,138.56 40,103.92 40,34.64" 
             fill="url(#socialAccentGrad)" stroke="white" stroke-width="6"/>
    
    <!-- Letter F inside hexagon -->
    <path d="M50 30h30v8h-22v10h20v8h-20v18h-8V30z" fill="white"/>
    
    <!-- Tech dots -->
    <circle cx="35" cy="35" r="4" fill="#10B981"/>
    <circle cx="65" cy="35" r="4" fill="#3B82F6"/>
    <circle cx="35" cy="103" r="4" fill="#3B82F6"/>
    <circle cx="65" cy="103" r="4" fill="#10B981"/>
  </g>
  
  <!-- Company name -->
  <text x="600" y="380" text-anchor="middle" font-family="'Google Sans', Arial, sans-serif" font-size="48" font-weight="700" fill="white">
    FeexSystems
  </text>
  
  <!-- Tagline -->
  <text x="600" y="420" text-anchor="middle" font-family="'Google Sans', Arial, sans-serif" font-size="24" font-weight="400" fill="#E5E7EB">
    Enhanced AI-Powered Platform
  </text>
  
  <!-- Subtitle -->
  <text x="600" y="460" text-anchor="middle" font-family="'Google Sans', Arial, sans-serif" font-size="18" font-weight="400" fill="#94A3B8">
    DevOps • Security • AI • Management
  </text>
  
  <!-- Circuit connections -->
  <g opacity="0.3" stroke="url(#socialAccentGrad)" stroke-width="3" fill="none">
    <path d="M 240 150 Q 400 180 960 200"/>
    <path d="M 295 450 Q 400 420 950 480"/>
    <path d="M 240 150 Q 295 300 295 450"/>
    <path d="M 960 200 Q 905 340 950 480"/>
  </g>
  
  <!-- Bottom accent line -->
  <rect x="100" y="520" width="1000" height="4" fill="url(#socialAccentGrad)" rx="2"/>
  
  <!-- Corner tech elements -->
  <g opacity="0.6">
    <rect x="120" y="120" width="20" height="20" rx="4" fill="url(#socialAccentGrad)"/>
    <rect x="1060" y="120" width="20" height="20" rx="4" fill="url(#socialAccentGrad)"/>
    <rect x="120" y="490" width="20" height="20" rx="4" fill="url(#socialAccentGrad)"/>
    <rect x="1060" y="490" width="20" height="20" rx="4" fill="url(#socialAccentGrad)"/>
  </g>
</svg> 