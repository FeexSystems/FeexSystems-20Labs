# FeexSystems Enterprise Google Cloud Build Pipeline
# Builds, tests, and deploys FeexSystems to Google Cloud Run

steps:
  # 1. Install dependencies and generate Prisma Client
  - name: 'node:20-alpine'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        npm ci
        npx prisma generate
    id: 'install-and-generate'

  # 2. Run TypeScript check and automated tests
  - name: 'node:20-alpine'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        npm run typecheck
        npm test
    id: 'typecheck-and-test'

  # 3. Build Docker container image using Kaniko with caching
  - name: 'gcr.io/kaniko-project/executor:latest'
    args:
      - '--destination=gcr.io/$PROJECT_ID/feexsystems-server:$COMMIT_SHA'
      - '--destination=gcr.io/$PROJECT_ID/feexsystems-server:latest'
      - '--dockerfile=Dockerfile.prod'
      - '--cache=true'
      - '--cache-ttl=168h'
    id: 'build-and-push-image'

  # 4. Deploy to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'feexsystems-server'
      - '--image=gcr.io/$PROJECT_ID/feexsystems-server:$COMMIT_SHA'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--memory=2Gi'
      - '--cpu=2'
      - '--min-instances=1'
      - '--max-instances=10'
      - '--concurrency=80'
      - '--timeout=300s'
      - '--set-secrets=DATABASE_URL=DATABASE_URL:latest,REDIS_URL=REDIS_URL:latest,GEMINI_API_KEY=GEMINI_API_KEY:latest,GITHUB_ACCESS_TOKEN=GITHUB_ACCESS_TOKEN:latest,GITHUB_WEBHOOK_SECRET=GITHUB_WEBHOOK_SECRET:latest'
      - '--set-env-vars=NODE_ENV=production,PORT=8080'
    id: 'deploy-to-cloud-run'

substitutions:
  _REGION: 'us-central1'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

images:
  - 'gcr.io/$PROJECT_ID/feexsystems-server:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/feexsystems-server:latest'
